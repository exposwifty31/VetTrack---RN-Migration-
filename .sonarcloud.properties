# SonarCloud Automatic Analysis configuration (no CI-side scanner exists —
# this file is the config surface Automatic Analysis honors).
#
# docs/** holds owner-approved design hand-off artifacts (e.g. the Aurora
# .dc.html reference mocks), not shipped code. Sonar's static text-contrast
# rule cannot evaluate their blur-composited glass backgrounds; the measured
# WCAG AA evidence lives in docs/design/aurora-home/direction-1c-aurora.md
# (text pairs >= 4.5; non-text indicators >= 3.0 per WCAG 1.4.11 — e.g. the
# 4.02 badge-fill pair).
# eas.json is EAS build/submit configuration, not shipped code. It carries the App
# Store Connect API *identifiers* (ascApiKeyId — the key's public "kid", sent in
# cleartext JWT headers; ascApiKeyIssuerId — the team-level issuer UUID; both printed
# in the ASC UI and committed in Expo's own eas.json docs), which rule json:S6418
# pattern-matches as hard-coded secrets. The actual secret — the .p8 private key — is
# gitignored (*.p8) and referenced by path only. A scoped
# sonar.issue.ignore.multicriteria rule was tried first and is NOT honored by
# SonarCloud Automatic Analysis (verified 2026-08-12: issues stayed OPEN after
# re-analysis), so the file is excluded the same way docs/** already is.
sonar.exclusions=docs/**,eas.json
