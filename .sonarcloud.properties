# SonarCloud Automatic Analysis configuration (no CI-side scanner exists —
# this file is the config surface Automatic Analysis honors).
#
# docs/** holds owner-approved design hand-off artifacts (e.g. the Aurora
# .dc.html reference mocks), not shipped code. Sonar's static text-contrast
# rule cannot evaluate their blur-composited glass backgrounds; the measured
# WCAG AA evidence lives in docs/design/aurora-home/direction-1c-aurora.md
# (text pairs >= 4.5; non-text indicators >= 3.0 per WCAG 1.4.11 — e.g. the
# 4.02 badge-fill pair).
sonar.exclusions=docs/**

# eas.json carries the App Store Connect API *identifiers* (ascApiKeyId, the key's
# public "kid"; ascApiKeyIssuerId, the team-level issuer UUID) that rule S6418
# pattern-matches as hard-coded secrets. They are not secrets: Apple prints both in
# the ASC UI and every client sends the kid in cleartext JWT headers; Expo's own
# eas.json docs commit them. The actual secret — the .p8 private key — is gitignored
# (*.p8) and referenced by path only. Scope: this one rule on this one file.
sonar.issue.ignore.multicriteria=easApiKeyIds
sonar.issue.ignore.multicriteria.easApiKeyIds.ruleKey=json:S6418
sonar.issue.ignore.multicriteria.easApiKeyIds.resourceKey=eas.json
